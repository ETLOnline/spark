<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Invitation</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #1a1a1a;
    "
  >
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="background-color: #f8fafc; padding: 20px 0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="600"
            style="
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
              box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            "
          >
            <!-- Logo -->
            <tr>
              <td align="center" style="padding: 24px 0 16px 0">
                <img
                  src="{{logoUrl}}"
                  alt="YourPlatform Logo"
                  width="120"
                  style="display: block; max-width: 120px; height: auto"
                />
              </td>
            </tr>

            <!-- Header -->
            <tr>
              <td
                align="center"
                style="
                  background-color: #51ecdc;
                  padding: 20px;
                  color: #0f172a;
                  font-size: 20px;
                  font-weight: bold;
                "
              >
                You’ve Been Added to a Project!
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td
                style="
                  padding: 32px;
                  font-size: 16px;
                  line-height: 1.5;
                  color: #1a1a1a;
                "
              >
                <p style="margin: 0 0 16px">Hi,</p>
                <p style="margin: 0 0 24px">
                  Great news! You’ve been added to the project
                  <strong>{{projectName}}</strong> by
                  <strong>{{inviterName}}</strong>.
                </p>
                <p style="margin: 0 0 24px">
                  Click the button below to view the project details and start
                  collaborating.
                </p>

                <!-- CTA Button -->
                <table
                  role="presentation"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                  align="center"
                  style="margin: 0 auto 24px"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#51ecdc"
                      style="border-radius: 6px"
                    >
                      <a
                        href="{{ctaLink}}"
                        target="_blank"
                        style="
                          display: inline-block;
                          padding: 12px 24px;
                          font-size: 16px;
                          font-weight: bold;
                          color: #0f172a;
                          text-decoration: none;
                        "
                      >
                        View Project
                      </a>
                    </td>
                  </tr>
                </table>

                <p style="margin: 0; font-size: 14px; color: #6b7280">
                  If you were added by mistake, you can ignore this message.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
