# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - etl-spark-dev

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env: # <-- Define environment variables for the build job here
      TURSO_DATABASE_URL : ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN : ${{ secrets.TURSO_AUTH_TOKEN }}
      WEBHOOK_SECRET : ${{ secrets.WEBHOOK_SECRET }}
      ABLY_API_KEY : ${{ secrets.ABLY_API_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY : ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY : ${{ secrets.CLERK_SECRET_KEY }}
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install --force
          npm run build --if-present
          npm run test --if-present
      # ---- START ADDED VERIFICATION STEPS ----
      - name: Check directory contents after build
        run: ls -la # List all files/folders, including hidden ones

      - name: Verify .next directory existence and contents
        run: |
          echo "Checking for .next directory..."
          if [ -d ".next" ]; then
            echo ".next directory FOUND."
            echo "Listing contents of .next:"
            ls -la .next # List contents of .next
          else
            echo "ERROR: .next directory NOT FOUND after build!"
            exit 1 # Fail the workflow immediately if .next is missing
          fi
      # ---- END ADDED VERIFICATION STEPS ----
      
      - name: Zip artifact for deployment
        run: zip -r release.zip . -x ".git/*" -x ".github/*"
    
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DAEA6198291B481F8340A14BD117AE2D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4ACE3ADD494E41DD9BCDC80EB9CC5D2F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5F0DB926AC94222A04BE549500D6953 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'etl-spark-dev'
          slot-name: 'Production'
          package: .
          
